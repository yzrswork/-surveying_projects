<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太陽による真北方向角の観測手簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:            #faf7f2;
  --paper-deep:       #f3ede2;
  --ink:              #1c1917;
  --ink-soft:         #44403c;
  --ink-faint:        #78716c;
  --rule:             #292524;
  --rule-soft:        #d6d3d1;
  --rule-faint:       #e7e5e4;
  --input-bg:         #fef9c3;
  --input-bg-active:  #fde68a;
  --accent:           #991b1b;
  --accent-bg:        #fef2f2;
  --error:            #dc2626;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif JP', 'Yu Mincho', serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 48px;
}

/* ── Header ── */
.doc-header {
  border-top: 2px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 20px 0 16px;
  margin-bottom: 28px;
}

.doc-header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-align: center;
  margin-bottom: 18px;
}

.header-info {
  display: grid;
  grid-template-columns: 160px 1fr 1fr 1fr;
  gap: 20px;
  margin-bottom: 16px;
}

.header-field { display: flex; flex-direction: column; gap: 4px; }

.header-field label {
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
}

.header-field input {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--input-bg);
  border: none;
  border-bottom: 1px solid var(--ink-faint);
  padding: 4px 2px;
  color: var(--ink);
  width: 100%;
  transition: border-color 0.15s, background 0.15s;
}

.header-field input:focus {
  outline: none;
  border-bottom: 2px solid var(--ink);
  background: var(--input-bg-active);
}

.display-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
  min-height: 15px;
}

.header-buttons {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}

/* ── Buttons ── */
button {
  font-family: 'Noto Serif JP', serif;
  font-size: 12px;
  padding: 6px 18px;
  border: 1px solid var(--rule-soft);
  background: var(--paper-deep);
  color: var(--ink-soft);
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: background 0.1s;
}
button:hover { background: var(--rule-faint); }

/* ── Observation sets ── */
.set-block {
  margin-bottom: 18px;
  break-inside: avoid;
  page-break-inside: avoid;
}

.set-heading {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 8px 0 5px;
  border-bottom: 1px solid var(--rule);
}

.set-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}

.set-meta {
  font-size: 11px;
  color: var(--ink-faint);
}

/* ── Observation table ── */
.obs-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 2px;
}

.obs-table th {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-faint);
  text-align: center;
  padding: 4px 6px;
  border-bottom: 1px solid var(--rule-faint);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.obs-table td {
  padding: 2px 4px;
  text-align: center;
  font-size: 12px;
  border-bottom: 1px solid var(--rule-faint);
}

.obs-table td.c-rownum {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
  width: 22px;
}

.obs-table td.c-face {
  font-size: 11px;
  color: var(--ink-soft);
  width: 28px;
}

.obs-table td.c-target {
  font-size: 11px;
  width: 34px;
}

.obs-table td.c-time { width: 96px; }
.obs-table td.c-angle { width: 118px; }

.obs-table td.c-calc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  text-align: right;
  padding-right: 8px;
}

.obs-table td.c-nodash {
  color: var(--ink-faint);
  font-size: 10px;
}

.obs-table td.c-avg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink);
  font-weight: 500;
  text-align: right;
  padding-right: 10px;
  width: 140px;
  background: var(--accent-bg);
}
.obs-table td.c-avg.c-flat {
  background: transparent;
}

/* ── Inputs inside table ── */
input[type="text"].t-time,
input[type="text"].t-angle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--input-bg);
  border: none;
  border-bottom: 1px solid var(--ink-faint);
  padding: 2px 4px;
  color: var(--ink);
  width: 100%;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}

input[type="text"].t-time:focus,
input[type="text"].t-angle:focus {
  outline: none;
  border-bottom: 2px solid var(--ink);
  background: var(--input-bg-active);
}

input.is-error {
  border-bottom: 2px solid var(--error) !important;
  background: #fff0f0 !important;
}

/* ── Set summary ── */
.set-summary {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0;
  padding: 8px 4px 4px;
  border-top: 1px solid var(--rule-faint);
}

.set-summary .s-label {
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  margin-right: 6px;
  white-space: nowrap;
}

.set-summary .s-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink);
}

.set-summary .ms-val {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  margin-right: 0;
}

.set-summary .ms-label {
  color: var(--ink-soft);
}

.set-summary .ms-group {
  margin-left: auto;
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
}

.set-summary .ms-group .s-label {
  margin-right: 6px;
}

.set-divider {
  border: none;
  border-top: 1px solid var(--rule-faint);
  margin: 4px 0;
}

/* Sets column wrappers (screen: stacked; print: side-by-side) */
#sets-container {
  display: flex;
  flex-direction: column;
}
.sets-column {
  display: flex;
  flex-direction: column;
}

/* ── Print ── */
@media print {
  @page { size: A4 portrait; margin: 10mm 12mm; }

  body {
    font-size: 6.5pt;
    background: #ffffff;
    color: #000;
  }

  .container {
    max-width: 100%;
    padding: 0;
    margin: 0;
  }

  /* Header */
  .doc-header {
    padding: 1px 0 2px;
    margin-bottom: 2px;
    border-top: 1pt solid #000;
    border-bottom: 0.5pt solid #000;
  }
  .doc-header h1 {
    font-size: 9pt;
    margin-bottom: 2px;
    letter-spacing: 0.05em;
    text-align: center;
  }
  .header-info {
    display: flex;
    flex-direction: row;
    gap: 12px;
    margin-bottom: 0;
    align-items: baseline;
  }
  .header-field {
    flex-direction: row;
    align-items: baseline;
    gap: 4px;
  }
  .header-field label {
    font-size: 5.5pt;
    margin-right: 2px;
  }
  .header-field input {
    font-size: 7pt;
    padding: 0 2px;
    background: transparent !important;
    border: none;
    border-bottom: 0.5pt solid #000;
    width: auto;
    min-width: 60px;
    font-weight: 400;
  }
  .display-val { display: none !important; }
  button, .header-buttons, .clear-section { display: none !important; }

  /* 2-column layout for sets (1-5 left, 6-10 right) */
  #sets-container {
    display: flex !important;
    flex-direction: row !important;
    gap: 6mm;
    align-items: flex-start;
  }
  .sets-column {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* Sets */
  .set-block {
    margin: 0;
    padding: 0;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .set-divider {
    display: block !important;
    height: 0;
    border: none;
    border-top: 0.3pt solid #ccc;
    margin: 1mm 0;
    break-after: avoid;
  }
  .set-heading {
    padding: 0;
    margin: 0;
    border-bottom: none;
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
  }
  .set-num { font-size: 6.5pt; font-weight: 600; }
  .set-meta { font-size: 5.5pt; color: #333; }

  /* Observation table */
  .obs-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 5.5pt;
    font-family: 'JetBrains Mono', monospace;
    table-layout: fixed;
  }
  .obs-table th {
    font-size: 5pt;
    padding: 0 1px;
    line-height: 1.1;
    border-bottom: 0.5pt solid #000;
    white-space: nowrap;
    font-family: 'Noto Serif JP', serif;
    font-weight: 400;
  }
  .obs-table td {
    font-size: 5.5pt;
    padding: 0 1px;
    line-height: 1.05;
    border: none;
    white-space: nowrap;
    overflow: hidden;
  }
  /* Hide 変換値 column entirely on print (header at 6th + all c-calc cells) */
  .obs-table th:nth-child(6),
  .obs-table td.c-calc {
    display: none;
  }
  /* Explicit column widths so c-time / c-angle screen widths don't bleed in */
  .obs-table th:nth-child(1),
  .obs-table td.c-rownum { width: 4mm; }
  .obs-table th:nth-child(2),
  .obs-table td.c-face   { width: 7mm; }
  .obs-table th:nth-child(3),
  .obs-table td.c-target { width: 9mm; }
  .obs-table th:nth-child(4),
  .obs-table td.c-time   { width: 22mm; }
  .obs-table th:nth-child(5),
  .obs-table td.c-angle  { width: 25mm; }
  .obs-table th:nth-child(7),
  .obs-table td.c-avg    { width: 23mm; }
  .obs-table td.c-avg {
    font-size: 5.5pt;
    font-weight: 600;
    background: transparent !important;
    padding-right: 2px;
  }
  .obs-table td.c-avg.c-flat {
    background: transparent !important;
  }
  .obs-table input {
    font-size: 5.5pt;
    font-family: 'JetBrains Mono', monospace;
    padding: 0;
    background: transparent !important;
    border: none !important;
    outline: none !important;
    width: 100%;
    color: #000;
    font-weight: 400;
  }
  .obs-table input.is-error {
    background: transparent !important;
    color: #000 !important;
    border: none !important;
  }

  /* Summary (T' and M-S in one row) */
  .set-summary {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    flex-wrap: nowrap;
    gap: 0;
    padding: 0 1px;
    margin: 0;
    border-top: 0.3pt solid #ccc;
  }
  .set-summary .s-label {
    font-size: 5pt;
    font-family: 'Noto Serif JP', serif;
    color: #444;
    margin-right: 3px;
    white-space: nowrap;
  }
  .set-summary .s-val {
    font-size: 6pt;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    color: #000;
  }
  .set-summary .ms-val {
    font-size: 6pt;
    font-weight: 600;
    color: #000;
    margin-right: 0;
  }
  .set-summary .ms-label { color: #000; }
  .set-summary .ms-group {
    margin-left: auto;
    display: inline-flex;
    align-items: baseline;
    white-space: nowrap;
  }
  .set-summary .ms-group .s-label {
    margin-right: 3px;
  }
}
</style>
</head>
<body>
<div class="container">

  <!-- ===== Document header ===== -->
  <header class="doc-header">
    <h1>太陽による真北方向角の観測手簿</h1>
    <div class="header-info">
      <div class="header-field">
        <label for="obs-date">観測日</label>
        <input type="date" id="obs-date">
      </div>
      <div class="header-field">
        <label for="obs-lat">緯度（度.分秒）</label>
        <input type="number" id="obs-lat" step="0.000001" placeholder="35.423577">
        <div class="display-val" id="lat-display"></div>
      </div>
      <div class="header-field">
        <label for="obs-lon">経度（度.分秒）</label>
        <input type="number" id="obs-lon" step="0.000001" placeholder="139.485344">
        <div class="display-val" id="lon-display"></div>
      </div>
      <div class="header-field">
        <label for="obs-point">観測点</label>
        <input type="text" id="obs-point" placeholder="T1〜T2">
      </div>
    </div>
    <div class="header-buttons">
      <button onclick="window.print()">印刷（Ctrl+P）</button>
      <button onclick="clearAll()">全クリア</button>
    </div>
  </header>

  <!-- ===== Observation sets (built by JS) ===== -->
  <div id="sets-container"></div>

</div><!-- .container -->

<script>
'use strict';

// ─────────────────────────────────────────────
// Core math helpers
// ─────────────────────────────────────────────

function dms2deg(x) {
  if (x == null || x === '' || isNaN(x)) return NaN;
  x = parseFloat(x);
  const d = Math.floor(x);
  const frac = (x - d) + 1e-6;
  const mRaw = Math.floor(frac * 100) / 100;
  const mDeg = mRaw * 100 / 60;
  const sRaw = x - Math.floor(x * 100) / 100;
  const sDeg = sRaw * 10000 / 3600;
  return d + mDeg + sDeg;
}

function deg2dms(deg) {
  if (deg == null || isNaN(deg)) return '—';
  const sign = deg < 0 ? '-' : '';
  deg = Math.abs(deg);
  const d = Math.floor(deg);
  const mTot = (deg - d) * 60;
  const m = Math.floor(mTot + 1e-9);
  const s = (mTot - m) * 60;
  const sStr = s.toFixed(2).padStart(5, '0');
  return `${sign}${d}°${String(m).padStart(2, '0')}′${sStr}″`;
}

/** Format-validate "H.MMSS" time string (boolean) */
function validateTimeStr(x) {
  if (x == null || x === '') return true;
  const str = String(x).trim();
  if (!/^\d{1,2}\.\d{4}$/.test(str)) return false;
  const [hStr, frac] = str.split('.');
  const h  = parseInt(hStr, 10);
  const mm = parseInt(frac.slice(0, 2), 10);
  const ss = parseInt(frac.slice(2, 4), 10);
  if (h < 0 || h > 23)  return false;
  if (mm < 0 || mm > 59) return false;
  if (ss < 0 || ss > 59) return false;
  return true;
}

/** "H.MMSS" (period-separated) → day fraction; NaN on invalid */
function timeStr2serial(x) {
  if (x == null || x === '' || !validateTimeStr(x)) return NaN;
  const str = String(x).trim();
  const [hStr, frac] = str.split('.');
  const h  = parseInt(hStr, 10);
  const mm = parseInt(frac.slice(0, 2), 10);
  const ss = parseInt(frac.slice(2, 4), 10);
  return (h * 3600 + mm * 60 + ss) / 86400;
}

/** Day fraction → "HH:MM:SS.ss" (fractional seconds, 2 decimals) */
function serial2timeFrac(s) {
  if (s == null || isNaN(s)) return '—';
  const total = s * 86400;
  let h   = Math.floor(total / 3600);
  let m   = Math.floor((total - h * 3600) / 60);
  let sec = total - h * 3600 - m * 60;
  if (sec >= 59.995) {
    sec = 0;
    m += 1;
    if (m >= 60) { m = 0; h += 1; }
  }
  const secStr = sec.toFixed(2).padStart(5, '0');
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${secStr}`;
}

function norm360(x) { return ((x % 360) + 360) % 360; }

/** Format-validate DD.MMSSss raw input string (boolean).
 *  Rejects partially parseable garbage like "120.3045abc", "120,3045", "120．3045". */
function validateDmsStr(v) {
  if (v === '' || v == null) return true;
  const str = String(v).trim();
  if (!/^\d{1,3}(\.\d{1,4})?$/.test(str)) return false;
  const x = parseFloat(str);
  if (isNaN(x) || x < 0 || x >= 360) return false;
  const parts = str.split('.');
  if (parts.length === 2) {
    const frac = parts[1].padEnd(4, '0');
    const mm = parseInt(frac.slice(0, 2), 10);
    const ss = parseInt(frac.slice(2, 4), 10);
    if (mm > 59) return false;
    if (ss > 59) return false;
  }
  return true;
}

// ─────────────────────────────────────────────
// Set configuration
// ─────────────────────────────────────────────

function setCfg(n) {
  const odd = (n % 2 === 1);
  const rows = odd
    ? [
        { face:'r', tgt:'m', hasTime:false },
        { face:'r', tgt:'s', hasTime:true  },
        { face:'r', tgt:'s', hasTime:true  },
        { face:'l', tgt:'s', hasTime:true  },
        { face:'l', tgt:'s', hasTime:true  },
        { face:'l', tgt:'m', hasTime:false },
      ]
    : [
        { face:'l', tgt:'m', hasTime:false },
        { face:'l', tgt:'s', hasTime:true  },
        { face:'l', tgt:'s', hasTime:true  },
        { face:'r', tgt:'s', hasTime:true  },
        { face:'r', tgt:'s', hasTime:true  },
        { face:'r', tgt:'m', hasTime:false },
      ];
  return {
    odd,
    rotation: (n - 1) * 18,
    order: odd ? 'r, l 順' : 'l, r 順',
    rows,
    mrIdx:    odd ? 0 : 5,
    mlIdx:    odd ? 5 : 0,
    sIdxs:    [1, 2, 3, 4],
    judgeIdx: odd ? 1 : 3,
    timeIdxs: [1, 2, 3, 4],
  };
}

// ─────────────────────────────────────────────
// DOM generation
// ─────────────────────────────────────────────

function buildSets() {
  const container = document.getElementById('sets-container');
  const colLeft = document.createElement('div');
  colLeft.className = 'sets-column sets-column-left';
  const colRight = document.createElement('div');
  colRight.className = 'sets-column sets-column-right';
  for (let n = 1; n <= 10; n++) {
    const targetCol = n <= 5 ? colLeft : colRight;
    const isFirstInCol = (n === 1 || n === 6);
    if (!isFirstInCol) {
      const hr = document.createElement('hr');
      hr.className = 'set-divider';
      targetCol.appendChild(hr);
    }
    targetCol.appendChild(makeSetBlock(n));
  }
  container.appendChild(colLeft);
  container.appendChild(colRight);
}

function avgCell(n, ri, cfg) {
  const isTopM = (ri === 0);
  const isBotM = (ri === 5);
  const isMsRow = (cfg.odd && ri === 1) || (!cfg.odd && ri === 4);
  if (isTopM)  return `<td class="c-avg" id="s${n}-mm-top"></td>`;
  if (isBotM)  return `<td class="c-avg" id="s${n}-mm-bot"></td>`;
  if (isMsRow) return `<td class="c-avg" id="s${n}-ms-cell"></td>`;
  return `<td class="c-avg c-flat"></td>`;
}

function makeSetBlock(n) {
  const cfg = setCfg(n);
  const div = document.createElement('div');
  div.className = 'set-block';
  div.id = `set${n}`;

  const heading = document.createElement('div');
  heading.className = 'set-heading';
  heading.innerHTML =
    `<span class="set-num">セット ${n}</span>` +
    `<span class="set-meta">輪郭 ${cfg.rotation}°　${cfg.order}</span>`;
  div.appendChild(heading);

  const tbl = document.createElement('table');
  tbl.className = 'obs-table';
  tbl.innerHTML =
    `<thead><tr>` +
    `<th>行</th><th>正反</th><th>目標</th>` +
    `<th>時　刻</th><th>観測角（度.分秒）</th><th>変換値</th><th>正反の平均</th>` +
    `</tr></thead>`;
  const tbody = document.createElement('tbody');

  cfg.rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    const faceLabel = row.face === 'r' ? '正' : '反';
    const tgtLabel  = row.tgt  === 'm' ? '後視' : '太陽';
    const tabBase   = (n - 1) * 12 + ri * 2 + 1;

    const timeCell = row.hasTime
      ? `<td class="c-time"><input type="text" class="t-time"
           id="s${n}r${ri}t" placeholder="H.MMSS"
           data-s="${n}" data-r="${ri}" data-f="t"
           tabindex="${tabBase}"></td>`
      : `<td class="c-time c-nodash">—</td>`;

    const angleCell = row.tgt === 'm' || row.tgt === 's'
      ? `<td class="c-angle"><input type="text" class="t-angle" inputmode="decimal"
           id="s${n}r${ri}a" placeholder="0.0000"
           data-s="${n}" data-r="${ri}" data-f="a"
           tabindex="${tabBase + 1}"></td>`
      : `<td class="c-angle"></td>`;

    tr.innerHTML =
      `<td class="c-rownum">${ri + 1}</td>` +
      `<td class="c-face">${faceLabel}</td>` +
      `<td class="c-target">${tgtLabel}</td>` +
      timeCell +
      angleCell +
      `<td class="c-calc" id="s${n}r${ri}c"></td>` +
      avgCell(n, ri, cfg);
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  div.appendChild(tbl);

  const summary = document.createElement('div');
  summary.className = 'set-summary';
  summary.innerHTML =
    `<span class="s-label">T′（平均時刻）</span>` +
    `<span class="s-val" id="s${n}-tp">—</span>` +
    `<span class="ms-group">` +
      `<span class="s-label ms-label">M − S</span>` +
      `<span class="s-val ms-val" id="s${n}-ms">—</span>` +
    `</span>`;
  div.appendChild(summary);

  return div;
}

// ─────────────────────────────────────────────
// Calculation
// ─────────────────────────────────────────────

function getAngle(n, ri) {
  const el = document.getElementById(`s${n}r${ri}a`);
  return el ? el.value.trim() : '';
}
function getTime(n, ri) {
  const el = document.getElementById(`s${n}r${ri}t`);
  return el ? el.value.trim() : '';
}

function calcSet(n) {
  const cfg = setCfg(n);

  const aStr = Array.from({length:6}, (_, ri) => getAngle(n, ri));

  aStr.forEach((v, ri) => {
    const el = document.getElementById(`s${n}r${ri}a`);
    if (!el) return;
    el.classList.toggle('is-error', v !== '' && !validateDmsStr(v));
  });

  cfg.timeIdxs.forEach(ri => {
    const el = document.getElementById(`s${n}r${ri}t`);
    if (!el) return;
    const v = el.value.trim();
    el.classList.toggle('is-error', v !== '' && !validateTimeStr(v));
  });

  // Validation failure → NaN before any arithmetic touches the value
  const degs = aStr.map(v => {
    if (v === '' || !validateDmsStr(v)) return NaN;
    return dms2deg(parseFloat(v));
  });

  degs.forEach((deg, ri) => {
    const cell = document.getElementById(`s${n}r${ri}c`);
    if (!cell) return;
    if (aStr[ri] === '') {
      cell.textContent = '';
      cell.style.color = '';
    } else if (isNaN(deg)) {
      cell.textContent = 'エラー';
      cell.style.color = 'var(--error)';
    } else {
      cell.textContent = deg2dms(deg);
      cell.style.color = '';
    }
  });

  // M_m
  const mrDeg = degs[cfg.mrIdx];
  const mlDeg = degs[cfg.mlIdx];
  let Mm = NaN;
  if (!isNaN(mrDeg) && !isNaN(mlDeg)) {
    Mm = norm360(((mrDeg + mlDeg) - 180) / 2);
  }

  // M_s with ±360 correction
  const sDegs = cfg.sIdxs.map(i => degs[i]);
  let Ms = NaN;
  if (sDegs.every(v => !isNaN(v))) {
    const sSum = sDegs.reduce((a, b) => a + b, 0);
    const judgeRaw = parseFloat(aStr[cfg.judgeIdx]);
    const correction = (!isNaN(judgeRaw) && judgeRaw < 180) ? -360 : +360;
    Ms = norm360((sSum + correction) / 4);
  }

  // T' (mean of 4 solar times)
  const tSerials = cfg.timeIdxs.map(ri => timeStr2serial(getTime(n, ri)));
  let Tp = NaN;
  if (tSerials.every(v => !isNaN(v))) {
    Tp = tSerials.reduce((a, b) => a + b, 0) / 4;
  }

  // M-S
  let MS = NaN;
  if (!isNaN(Mm) && !isNaN(Ms)) {
    MS = norm360(Mm - Ms);
  }

  const mmStr = isNaN(Mm) ? '' : deg2dms(Mm);
  const msStr = isNaN(Ms) ? '' : deg2dms(Ms);
  setText(`s${n}-mm-top`,  mmStr);
  setText(`s${n}-mm-bot`,  mmStr);
  setText(`s${n}-ms-cell`, msStr);
  setText(`s${n}-tp`,      isNaN(Tp) ? '—' : serial2timeFrac(Tp));
  setText(`s${n}-ms`,      isNaN(MS) ? '—' : deg2dms(MS));

  return MS;
}

function calcAll() {
  for (let n = 1; n <= 10; n++) {
    calcSet(n);
  }
}

// ─────────────────────────────────────────────
// Persistence (localStorage)
// ─────────────────────────────────────────────

const STORAGE_KEY = 'taiyou_kansoku_data_v3';

function saveData() {
  const data = {
    date:  document.getElementById('obs-date').value,
    lat:   document.getElementById('obs-lat').value,
    lon:   document.getElementById('obs-lon').value,
    point: document.getElementById('obs-point').value,
    sets: {},
  };
  for (let n = 1; n <= 10; n++) {
    const cfg = setCfg(n);
    data.sets[n] = {};
    for (let ri = 0; ri < 6; ri++) {
      data.sets[n][ri] = {
        a: getAngle(n, ri),
        t: cfg.rows[ri].hasTime ? getTime(n, ri) : '',
      };
    }
  }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(_) {}
}

function loadData() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(_) { return; }
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch(_) { return; }

  if (data.date)  setVal('obs-date',  data.date);
  if (data.lat)   setVal('obs-lat',   data.lat);
  if (data.lon)   setVal('obs-lon',   data.lon);
  if (data.point) setVal('obs-point', data.point);

  updateLatDisplay();
  updateLonDisplay();

  if (!data.sets) return;
  for (let n = 1; n <= 10; n++) {
    if (!data.sets[n]) continue;
    const cfg = setCfg(n);
    for (let ri = 0; ri < 6; ri++) {
      const row = data.sets[n][ri];
      if (!row) continue;
      if (row.a) setVal(`s${n}r${ri}a`, row.a);
      if (row.t && cfg.rows[ri].hasTime) setVal(`s${n}r${ri}t`, row.t);
    }
  }
}

function clearAll() {
  if (!confirm('全てのデータをクリアしますか？\nこの操作は取り消せません。')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
  location.reload();
}

// ─────────────────────────────────────────────
// Header display helpers
// ─────────────────────────────────────────────

function updateLatDisplay() {
  const v = document.getElementById('obs-lat').value;
  const el = document.getElementById('lat-display');
  if (v === '') { el.textContent = ''; return; }
  const deg = dms2deg(parseFloat(v));
  el.textContent = isNaN(deg) ? 'エラー' : deg2dms(deg);
}

function updateLonDisplay() {
  const v = document.getElementById('obs-lon').value;
  const el = document.getElementById('lon-display');
  if (v === '') { el.textContent = ''; return; }
  const deg = dms2deg(parseFloat(v));
  el.textContent = isNaN(deg) ? 'エラー' : deg2dms(deg);
}

// ─────────────────────────────────────────────
// Utility DOM helpers
// ─────────────────────────────────────────────

function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = v;
}
function setVal(id, v) {
  const el = document.getElementById(id);
  if (el) el.value = v;
}

// ─────────────────────────────────────────────
// Debounce save
// ─────────────────────────────────────────────

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 500);
}

// ─────────────────────────────────────────────
// Event wiring
// ─────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', function () {
  buildSets();
  loadData();
  calcAll();

  document.addEventListener('input', function (e) {
    const el = e.target;
    const id = el.id || '';

    if (el.dataset.s) {
      calcAll();
      scheduleSave();
    } else if (id === 'obs-lat') {
      updateLatDisplay();
      scheduleSave();
    } else if (id === 'obs-lon') {
      updateLonDisplay();
      scheduleSave();
    } else if (['obs-date','obs-point'].includes(id)) {
      scheduleSave();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    const focusable = Array.from(
      document.querySelectorAll('input:not([disabled]):not([type="date"])')
    );
    const idx = focusable.indexOf(document.activeElement);
    if (idx >= 0 && idx < focusable.length - 1) {
      e.preventDefault();
      focusable[idx + 1].focus();
    }
  });

  document.addEventListener('focusin', function (e) {
    const el = e.target;
    if (el.type === 'number' || el.classList.contains('t-time') || el.classList.contains('t-angle')) {
      el.select();
    }
  });
});
</script>
